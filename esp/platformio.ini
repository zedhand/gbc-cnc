; LinkBus CNC pendant module — ESP-12F
; First flash over USB-serial (disconnect the GRBL wires from GPIO1/GPIO3 while flashing):
;   pio run -e esp12f -t upload        firmware
;   pio run -e esp12f -t uploadfs      LittleFS image from data/ (includes rom/pendant.gba)
; Afterwards over Wi-Fi:
;   pio run -e ota -t upload

[platformio]
default_envs = esp12f

[env:esp12f]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
lib_extra_dirs = ../shared
lib_ldf_mode = deep+
build_flags = -Wall
monitor_speed = 115200

[env:ota]
extends = env:esp12f
upload_protocol = espota
upload_port = linkbus-cnc.local
upload_flags = --auth=linkbus
